name: Publish npm Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # OIDC trusted publishing (npmjs.com package Settings -> Trusted Publisher):
  # npm exchanges this job's OIDC token for a short-lived publish token at
  # publish time, so no NPM_TOKEN secret is needed at all. Requires npm CLI
  # >= 11.5.0, hence the explicit upgrade step below -- which in turn needs
  # Node 22.22.2+/24.15.0+/26+ (current npm@latest's own engines field), so
  # Node 20 (this job's default elsewhere in the repo) isn't enough here.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TypeScript
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: TypeScript/package-lock.json

      - name: Update npm (OIDC trusted publishing needs >= 11.5.0)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check if this version is already published
        id: guard
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          if npm view "d-ary-heap@$LOCAL_VERSION" version >/dev/null 2>&1; then
            echo "d-ary-heap@$LOCAL_VERSION is already on npm; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN here: OIDC trusted publishing supplies auth via
      # the id-token permission above once the npmjs.com side is configured.
      - name: Publish to npm
        if: steps.guard.outputs.should_publish == 'true'
        run: npm publish
