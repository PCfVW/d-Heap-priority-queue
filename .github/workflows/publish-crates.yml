name: Publish crates.io Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: cargo test --locked

      - name: Check if this version is already published
        id: guard
        run: |
          LOCAL_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/d-ary-heap/$LOCAL_VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "d-ary-heap $LOCAL_VERSION is already on crates.io; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.guard.outputs.should_publish == 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
