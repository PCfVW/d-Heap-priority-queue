name: Publish crates.io Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Matches the crates.io Trusted Publishing config of d-ary-heap (PCfVW/d-Heap-priority-queue,
    # this filename, environment crates-io): the filename publish-crates.yml is load-bearing.
    environment: crates-io
    permissions:
      id-token: write # OIDC token for Trusted Publishing
      contents: read
    defaults:
      run:
        working-directory: Rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: cargo test --locked

      # Before the version check, so that a run with nothing to publish (workflow_dispatch on an
      # already published version) still proves crates.io accepts this workflow. The token is
      # short-lived and the action revokes it when the job ends.
      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Check if this version is already published
        id: guard
        run: |
          LOCAL_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/d-ary-heap/$LOCAL_VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "d-ary-heap $LOCAL_VERSION is already on crates.io; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.guard.outputs.should_publish == 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
