[package]
name = "aggregate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Aggregates benchmarks/results/**/*.{jsonl,stats.json,rss.json,profile.json} into benchmarks/README.md, SUMMARY.md, and SECTIONS.md"

[[bin]]
name = "aggregate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
